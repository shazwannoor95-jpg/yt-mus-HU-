plugins {
    id 'com.android.application' version '8.9.0'
}

android {
    namespace 'my.ytmhu'
    compileSdk 35

    defaultConfig {
        applicationId 'my.ytmhu'
        minSdk 27
        targetSdk 32
        versionCode 43
        versionName '0.4.38'
        testInstrumentationRunner 'my.ytmhu.VideoFixtureInstrumentation'
    }

    buildTypes {
        videoFixture {
            initWith debug
            applicationIdSuffix '.videofixture'
            matchingFallbacks = ['debug']
        }
    }
    testBuildType = providers.gradleProperty('visibleVideoFixture').isPresent() ? 'videoFixture' : 'debug'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def existingDebugKey = rootProject.file('build/debug.keystore')
    if (existingDebugKey.isFile()) {
        signingConfigs.debug.storeFile = existingDebugKey
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

configurations {
    japaneseDictionaryFixture
}

tasks.withType(Test).configureEach {
    inputs.files(configurations.japaneseDictionaryFixture)
    doFirst {
        systemProperty 'ytm.test.japanese.dictionary', configurations.japaneseDictionaryFixture.singleFile.absolutePath
    }
}

dependencies {
    japaneseDictionaryFixture('com.atilika.kuromoji:kuromoji-ipadic:0.9.0') { transitive = false }
    implementation 'com.atilika.kuromoji:kuromoji-core:0.9.0'
    implementation 'net.crizin:korean-romanizer:2.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
